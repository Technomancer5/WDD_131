<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="WDD 131 DOM manipulation and theme practice."
    >
    <meta name="author" content="Johnny">

    <title>WDD 131 | DOM Manipulation</title>

    <link rel="stylesheet" href="dom.css">
    <script src="dom.js" defer></script>
</head>

<body>
    <header>
        <h1>DOM Manipulation</h1>
    </header>

    <main>
        <section>
            <h2>Web Development</h2>

            <div class="webdev-picker">
                <label for="webdevlist">Choose a web technology:</label>

                <select name="code" id="webdevlist">
                    <option value="">Choose One:</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="js">JavaScript</option>
                </select>
            </div>

            <div class="theme-picker">
                <label for="theme-select">Choose a theme:</label>

                <select id="theme-select">
                    <option value="">Default</option>
                    <option value="ocean">Ocean</option>
                    <option value="forest">Forest</option>
                    <option value="desert">Desert</option>
                </select>
            </div>
        </section>
    </main>

    <footer>
        <p>WDD 131 DOM Practice</p>
    </footer>
</body>
</html>
