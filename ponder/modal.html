<!DOCTYPE html>
<html lang="en">
<!-- GitHub Pages: https://technomancer5.github.io/WDD_131/ponder/modal.html-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="WDD 131 responsive gallery with modal image viewer."
    >
    <meta name="author" content="Johnny">

    <title>Responsive Gallery with Modals</title>

    <link rel="stylesheet" href="modal.css">
    <script src="modal.js" defer></script>
</head>

<body>
    <main>
        <h1>Gallery</h1>

        <section class="gallery">
            <figure>
                <img src="images/book-sm.jpg" alt="person reading a book">
            </figure>

            <figure>
                <img src="images/couch-sm.jpg" alt="person sitting on a couch with a phone">
            </figure>

            <figure>
                <img src="images/desk-sm.jpg" alt="a work desktop">
            </figure>

            <figure>
                <img src="images/keyboard-sm.jpg" alt="person typing on a keyboard">
            </figure>

            <figure>
                <img src="images/phone-sm.jpg" alt="person looking at a phone">
            </figure>

            <figure>
                <img src="images/sit-sm.jpg" alt="person sitting on a couch">
            </figure>
        </section>

        <dialog>
            <img src="" alt="">
            <button class="close-viewer" type="button">X</button>
        </dialog>
    </main>
</body>
</html>
