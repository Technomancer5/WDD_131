<!DOCTYPE html>
<html lang="en">
<!-- GitHub Pages: https://technomancer5.github.io/WDD_131/recipes/ -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="RecipeBook - simple and delicious recipes."
    >
    <meta name="author" content="Johnny">

    <title>RecipeBook</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta
        property="og:description"
        content="Simple and delicious recipes, including a classic Apple Crisp."
    >
    <meta
        property="og:url"
        content="https://technomancer5.github.io/WDD_131/recipes/"
    >
    <meta
        property="og:image"
        content="https://technomancer5.github.io/WDD_131/recipes/images/social-preview.jpg"
    >

    <!-- X / Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RecipeBook">
    <meta
        name="twitter:description"
        content="Simple and delicious recipes, including a classic Apple Crisp."
    >
    <meta
        name="twitter:image"
        content="https://technomancer5.github.io/WDD_131/recipes/images/social-preview.jpg"
    >

    <link rel="icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="recipes.css">
</head>

<body>
    <header>
        <div class="logo">
            <img
                src="images/recipe-book.png"
                alt="RecipeBook logo"
            >
            <h1>RecipeBook</h1>
        </div>
    </header>

    <main>
        <form class="search" role="search">
            <label class="sr-only" for="recipe-search">
                Search recipes
            </label>

            <input
                id="recipe-search"
                type="search"
                placeholder="Find a recipe"
            >

            <button type="submit" aria-label="Search">
                <img
                    src="images/search.svg"
                    alt=""
                >
            </button>
        </form>

        <section class="recipe">
            <img
                class="recipe-image"
                src="images/apple-crisp.jpg"
                alt="Apple crisp served with vanilla ice cream"
            >

            <div class="recipe-details">
                <span class="tag">dessert</span>

                <h2>Apple Crisp</h2>

                <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars"
                >
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">☆</span>
                </span>

                <p class="description">
                    This apple crisp recipe is a simple yet delicious fall
                    dessert that's great served warm with vanilla ice cream.
                </p>
            </div>
        </section>
    </main>

    <footer>
    <p>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
            Recipe icons created by Freepik - Flaticon
        </a>
    </p>

    <div class="social">
        <!-- Social media SVGs recreated for this project; assignment reference: https://www.iconfinder.com/AlfredoCreates -->

        <a href="#">
            <img src="images/instagram_icon.svg" alt="instagram icon">
        </a>
        <a href="#">
            <img src="images/youtube_icon.svg" alt="youtube icon">
        </a>
        <a href="#">
            <img src="images/pinterest_icon.svg" alt="pinterest icon">
        </a>
    </div>
</footer>
</body>
</html>
