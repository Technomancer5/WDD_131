<!DOCTYPE html>
<html lang="en">
<!-- GitHub Pages: https://technomancer5.github.io/WDD_131/charactercard -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="An interactive JavaScript character card for WDD 131."
    >
    <meta name="author" content="Johnny">

    <title>Character Card</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta
        property="og:description"
        content="An interactive JavaScript character card featuring Snortleblat."
    >
    <meta
        property="og:url"
        content="https://technomancer5.github.io/WDD_131/charactercard/"
    >
    <meta
        property="og:image"
        content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
    >

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta
        name="twitter:description"
        content="An interactive JavaScript character card featuring Snortleblat."
    >
    <meta
        name="twitter:image"
        content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
    >

    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>
</head>

<body>
    <main>
        <section class="card" aria-label="Character Card">
            <img
                id="characterImage"
                class="image"
                src=""
                alt=""
            >

            <h1 id="characterName" class="name"></h1>

            <div class="stats">
                <p>
                    <strong>Class:</strong>
                    <span id="characterClass"></span>
                </p>

                <p>
                    <strong>Level:</strong>
                    <span id="characterLevel"></span>
                </p>

                <p>
                    <strong>Health:</strong>
                    <span id="characterHealth"></span>
                </p>
            </div>

            <div class="buttons">
                <button id="attacked" type="button">
                    Attacked
                </button>

                <button id="levelUp" type="button">
                    Level Up
                </button>
            </div>
        </section>
    </main>
</body>
</html>
