<!DOCTYPE html>
<html lang="en">
    <!-- GitHub Pages: https://technomancer5.github.io/WDD_131/eventform -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Event ticket registration form for WDD 131."
    >
    <meta name="author" content="Johnny">

    <title>Event Ticket</title>

    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="eventform.css">
    <script src="eventform.js" defer></script>
</head>

<body>
    <main class="wrapper">
        <h1>Event Ticket</h1>

        <form id="ticketForm">
            <div class="field">
                <label for="firstName">First Name</label>
                <input
                    id="firstName"
                    name="firstName"
                    type="text"
                    required
                >
            </div>

            <div class="field">
                <label for="lastName">Last Name</label>
                <input
                    id="lastName"
                    name="lastName"
                    type="text"
                    required
                >
            </div>

            <div class="field full">
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                >
            </div>

            <div class="field">
                <label for="type">Type</label>

                <select id="type" name="type" required>
                    <option value="">Choose one</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>
                </select>
            </div>

            <div class="field">
                <label for="eventDate">Event Date</label>

                <input
                    id="eventDate"
                    name="eventDate"
                    type="date"
                    required
                >
            </div>

            <div
                id="conditionalField"
                class="field full"
                hidden
            >
                <label id="conditionalLabel" for="conditionalInput">
                    Student I#
                </label>

                <input
                    id="conditionalInput"
                    name="conditionalInput"
                    type="text"
                >
            </div>

            <button class="full" type="submit">
                Create Ticket
            </button>
        </form>

        <div
            id="errors"
            class="errors"
            aria-live="polite"
        ></div>

        <section
            id="ticket"
            class="ticket"
            aria-live="polite"
        ></section>
    </main>
</body>
</html>
